<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID Selectors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p class="odd_number_class">Number 1 - I'm a class!</p>
    <div id="second_element_ID">Number 2 - I'm one ID.</div>
    <p class="odd_number_class odd_number_class_two">Number 3 - I'm a class, but cooler!</p>
    <div id="fourth_element_id">Number 4 - I'm another ID.</div>
    <p class="odd_number_class">Number 5 - I'm a class!</p>
  </body>
</html>
